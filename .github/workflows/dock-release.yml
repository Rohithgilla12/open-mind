name: dock release

# Tag a dock release (after bumping the version in apps/dock/src-tauri/tauri.conf.json):
#   git tag dock-vX.Y.Z && git push origin dock-vX.Y.Z
# Builds macOS (signed + notarized), Linux, and Windows bundles; publishes to
# CrabNebula Cloud (download page + in-app updater feed) and GitHub Releases.
on:
  push:
    tags:
      - "dock-v*"

env:
  CN_APPLICATION: "rohith-gilla/openmind"

jobs:
  draft:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Create draft release
        uses: crabnebula-dev/cloud-release@v0
        with:
          command: release draft ${{ env.CN_APPLICATION }} --framework tauri
          api-key: ${{ secrets.CN_API_KEY }}

  build:
    needs: draft
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: apps/dock
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/dock/src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: .

      - name: Prepare Apple signing (activates when secrets are configured)
        if: matrix.os == 'macos-latest'
        run: |
          if [ -n "$CERT" ]; then
            {
              echo "APPLE_CERTIFICATE=$CERT"
              echo "APPLE_CERTIFICATE_PASSWORD=$CERT_PW"
              echo "APPLE_SIGNING_IDENTITY=Developer ID Application: Rohith Gilla (7D2V3RM56T)"
            } >> "$GITHUB_ENV"
            echo "Developer ID signing enabled"
          else
            echo "No APPLE_CERTIFICATE secret — shipping unsigned"
          fi
          if [ -n "$API_P8" ]; then
            echo "$API_P8" > "$RUNNER_TEMP/apple-api-key.p8"
            {
              echo "APPLE_API_ISSUER=$API_ISSUER"
              echo "APPLE_API_KEY=$API_KEY_ID"
              echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/apple-api-key.p8"
            } >> "$GITHUB_ENV"
            echo "Notarization enabled"
          fi
        env:
          CERT: ${{ secrets.APPLE_CERTIFICATE }}
          CERT_PW: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          API_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}

      - name: Build (signed updater artifacts)
        run: pnpm exec tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""  # key generated without a password; the key itself is the secret

      - name: Upload assets to CrabNebula
        uses: crabnebula-dev/cloud-release@v0
        with:
          command: release upload ${{ env.CN_APPLICATION }} --framework tauri
          api-key: ${{ secrets.CN_API_KEY }}
          path: apps/dock/src-tauri

      - name: Upload assets to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "Openmind Dock ${GITHUB_REF_NAME#dock-v}" \
            --generate-notes 2>/dev/null || true
          find src-tauri/target/release/bundle -type f \
            \( -name "*.dmg" -o -name "*.app.tar.gz" -o -name "*.AppImage" \
               -o -name "*.deb" -o -name "*.rpm" -o -name "*-setup.exe" \
               -o -name "*.msi" -o -name "*.sig" \) \
            -exec gh release upload "$GITHUB_REF_NAME" {} --clobber \;

  publish:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Publish release
        uses: crabnebula-dev/cloud-release@v0
        with:
          command: release publish ${{ env.CN_APPLICATION }} --framework tauri
          api-key: ${{ secrets.CN_API_KEY }}
