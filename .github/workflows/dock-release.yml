name: dock release

# Tag a dock release (after bumping the version in apps/dock/src-tauri/tauri.conf.json):
#   git tag dock-v0.2.0 && git push origin dock-v0.2.0
# Builds the signed macOS bundle and publishes it to CrabNebula Cloud, which
# serves both the download page and the in-app updater feed.
on:
  push:
    tags:
      - "dock-v*"

env:
  CN_APPLICATION: "rohith-gilla/openmind"

jobs:
  release:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: apps/dock
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/dock/src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: .

      - name: Create draft release
        uses: crabnebula-dev/cloud-release@v0
        with:
          command: release draft ${{ env.CN_APPLICATION }} --framework tauri
          api-key: ${{ secrets.CN_API_KEY }}

      - name: Prepare Apple signing (activates when secrets are configured)
        run: |
          if [ -n "$CERT" ]; then
            {
              echo "APPLE_CERTIFICATE=$CERT"
              echo "APPLE_CERTIFICATE_PASSWORD=$CERT_PW"
              echo "APPLE_SIGNING_IDENTITY=Developer ID Application: Rohith Gilla (7D2V3RM56T)"
            } >> "$GITHUB_ENV"
            echo "Developer ID signing enabled"
          else
            echo "No APPLE_CERTIFICATE secret — shipping unsigned (Gatekeeper right-click-open applies)"
          fi
          if [ -n "$API_P8" ]; then
            echo "$API_P8" > "$RUNNER_TEMP/apple-api-key.p8"
            {
              echo "APPLE_API_ISSUER=$API_ISSUER"
              echo "APPLE_API_KEY=$API_KEY_ID"
              echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/apple-api-key.p8"
            } >> "$GITHUB_ENV"
            echo "Notarization enabled"
          fi
        env:
          CERT: ${{ secrets.APPLE_CERTIFICATE }}
          CERT_PW: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          API_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}

      - name: Build (signed updater artifacts)
        run: pnpm exec tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""  # key generated without a password; the key itself is the secret

      - name: Upload assets
        uses: crabnebula-dev/cloud-release@v0
        with:
          command: release upload ${{ env.CN_APPLICATION }} --framework tauri
          api-key: ${{ secrets.CN_API_KEY }}
          path: apps/dock/src-tauri

      - name: Publish release
        uses: crabnebula-dev/cloud-release@v0
        with:
          command: release publish ${{ env.CN_APPLICATION }} --framework tauri
          api-key: ${{ secrets.CN_API_KEY }}
