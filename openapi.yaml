openapi: 3.0.3
info: { title: Openmind API, version: 0.0.1 }
security:
  - bearerAuth: []
paths:
  /healthz:
    get:
      operationId: getHealthz
      security: []
      responses:
        "200":
          description: liveness
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string }
  /items:
    post:
      operationId: createItem
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateItemRequest" }
      responses:
        "201":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Item" }
    get:
      operationId: listItems
      parameters:
        - { name: limit, in: query, schema: { type: integer, default: 50 } }
        - { name: cursor, in: query, schema: { type: string }, description: "Opaque cursor from a previous page's nextCursor. Omit for the first page." }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ItemPage" }
        "400": { description: invalid cursor }
  /items/{id}:
    get:
      operationId: getItem
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: item detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ItemDetail" }
        "404":
          description: not found
    patch:
      operationId: patchItem
      description: "Edit an item. Currently supports replacing the full user-tags list (userTags). Tags are canonicalised server-side (trimmed, lowercased, deduped, capped)."
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateItemRequest" }
      responses:
        "200":
          description: updated item detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ItemDetail" }
        "400": { description: bad request }
        "404": { description: not found }
    delete:
      operationId: deleteItem
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: deleted }
        "404": { description: not found }
  /items/{id}/links:
    get:
      operationId: listItemLinks
      summary: Items linked to this item (both directions)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Linked items, newest link first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Item" }
        "404": { description: not found }
    post:
      operationId: createItemLink
      summary: Link this item to another (undirected, idempotent)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [toId]
              properties:
                toId: { type: string, format: uuid }
      responses:
        "201":
          description: Updated linked list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Item" }
        "400": { description: bad request }
        "404": { description: not found }
  /items/{id}/links/{toId}:
    delete:
      operationId: deleteItemLink
      summary: Remove a link
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: toId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Removed }
        "404": { description: not found }
  /items/{id}/related:
    get:
      operationId: getRelatedItems
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: up to 5 embedding-similar items, nearest first; empty when the item has no embedding
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/RelatedItem" }
        "404": { description: unknown item }
  /items/{id}/places:
    get:
      operationId: getItemPlaces
      summary: Places extracted from this item
      description: "Real-world places the enrichment pipeline extracted from the item (e.g. cafes named in an Instagram reel caption). Empty until the extract_places job has run; lat/lng are absent when no geocoder is configured."
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: extracted places, oldest first; empty when none
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Place" }
        "404": { description: unknown item }
  /items/{id}/places/{placeId}:
    delete:
      operationId: deleteItemPlace
      summary: Remove an extracted place
      description: "Drops one place the pipeline extracted from this item — the escape hatch for a model that hallucinated a venue or picked up a brand name that isn't somewhere you can go. Takes effect immediately and cannot be undone through the API. The place can only come back if extraction runs again for this item, which nothing triggers today; extraction is also non-deterministic, so a re-run would not necessarily reproduce it."
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: placeId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Removed }
        "404": { description: unknown item or place }
  /places:
    get:
      operationId: listPlaces
      summary: All of the user's extracted places
      description: "Every place extracted across the user's items, newest item first, joined with just enough item context to label a map pin. Includes places without coordinates (never geocoded or geocoder miss) — clients list those instead of pinning them."
      responses:
        "200":
          description: all places; empty when none
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PlaceWithItem" }
  /items/{id}/kindle:
    post:
      operationId: sendItemToKindle
      summary: Send this item to Kindle as an EPUB
      description: "Builds an EPUB from the item's body and e-mails it to the configured KINDLE_EMAIL address. Queued asynchronously; 409 when Send-to-Kindle is not configured, 422 when the item has no body to send."
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "202":
          description: queued
          content:
            application/json:
              schema:
                type: object
                required: [queued]
                properties:
                  queued: { type: boolean }
        "404": { description: not found }
        "409": { description: kindle is not configured }
        "422": { description: item has no body to send }
  /items/{id}/highlights:
    post:
      operationId: createItemHighlight
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateHighlightRequest" }
      responses:
        "201":
          description: Highlight created, with its mirrored quote card.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreateHighlightResponse" }
        "400": { description: "Invalid request (empty exact, over caps)." }
        "404": { description: unknown item }
    get:
      operationId: listItemHighlights
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Highlights anchored to this item, oldest first.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Highlight" }
        "404": { description: unknown item }
  /highlights/{id}:
    delete:
      operationId: deleteHighlight
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Highlight and its quote card removed. }
        "404": { description: unknown highlight }
  /assets:
    post:
      operationId: createAsset
      description: >
        Upload a local file as a first-class card (multipart field 'file').
        Images become image cards; PDFs and office documents (.docx, .odt,
        .rtf, .epub) become article cards, except .epub which becomes a book
        card. The type is sniffed from the content, never the supplied
        filename or part header; anything else is rejected with 415.
        Text extraction happens asynchronously in the enrichment pipeline, so
        the card returns immediately with an empty body.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        "201":
          description: created item (image, article, or book depending on the uploaded type)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Item" }
        "400": { description: bad request }
        "413": { description: payload too large }
        "415": { description: unsupported media type }
  /assets/{id}:
    get:
      operationId: getAsset
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      description: >
        Streams a stored asset's bytes with the content type recorded at
        upload. Covers every type POST /assets accepts: images, PDFs, and
        office documents. Documents and PDFs are served verbatim, so the
        response is the original file.
      responses:
        "200":
          description: asset bytes, served with the stored content type
          content:
            image/png: { schema: { type: string, format: binary } }
            image/jpeg: { schema: { type: string, format: binary } }
            image/gif: { schema: { type: string, format: binary } }
            image/webp: { schema: { type: string, format: binary } }
            image/avif: { schema: { type: string, format: binary } }
            application/pdf: { schema: { type: string, format: binary } }
            application/vnd.openxmlformats-officedocument.wordprocessingml.document: { schema: { type: string, format: binary } }
            application/vnd.oasis.opendocument.text: { schema: { type: string, format: binary } }
            application/rtf: { schema: { type: string, format: binary } }
            application/epub+zip: { schema: { type: string, format: binary } }
        "404": { description: not found }
  /export:
    get:
      operationId: exportItems
      responses:
        "200":
          description: full library export
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ItemDetail" }
  /import:
    post:
      operationId: importItems
      description: "Bulk-import saved items from an export file (multipart field 'file'). Recognises Netscape bookmark HTML (browsers, Pocket, Raindrop, Pinboard, Instapaper), CSV exports with a URL column (Pocket, Raindrop — a Raindrop 'folder' column becomes a tag), and a plain newline-delimited URL list. Each new URL becomes a pending item and is enriched asynchronously; URLs already saved are skipped, so re-importing is safe."
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        "200":
          description: import summary
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportResult" }
        "400": { description: bad request / unparseable file }
        "413": { description: payload too large }
  /import/raindrop:
    post:
      operationId: importRaindrop
      description: "Import bookmarks directly from Raindrop.io. The server uses the supplied API test token for a single export request against the Raindrop API (the token is never stored or logged), turning every bookmark into a pending item enriched asynchronously. Raindrop tags are preserved as user tags and each bookmark's collection becomes a tag too ('Unsorted' excepted). URLs already saved are skipped, so re-running is safe."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
                  description: "Raindrop.io API test token — create an app under Settings → Integrations, then copy its test token."
      responses:
        "200":
          description: import summary
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportResult" }
        "400": { description: missing token, or Raindrop.io rejected it }
        "413": { description: Raindrop export exceeds the size limit }
        "502": { description: Raindrop.io was unreachable or returned an error }
  /lenses:
    get:
      operationId: listLenses
      description: "List the caller's saved Lenses (saved query/rule collections), newest first."
      responses:
        "200":
          description: lenses
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Lens" }
    post:
      operationId: createLens
      description: "Create a Lens: a named, saved search rule. New saves matching the rule appear through it automatically."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateLensRequest" }
      responses:
        "201":
          description: created lens
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Lens" }
        "400": { description: bad request }
  /lenses/{id}:
    get:
      operationId: getLens
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: lens
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Lens" }
        "404": { description: not found }
    patch:
      operationId: updateLens
      description: "Rename a Lens and/or replace its rule."
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateLensRequest" }
      responses:
        "200":
          description: updated lens
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Lens" }
        "400": { description: bad request }
        "404": { description: not found }
    delete:
      operationId: deleteLens
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: deleted }
        "404": { description: not found }
  /lenses/{id}/items:
    get:
      operationId: getLensItems
      description: "Run the Lens's saved rule and return the ranked items it currently matches — a live view, so new saves appear here without manual filing. Matches are library-scoped by default (Mind only: saved items and kept feed items); set rule.scope to all to include the unkept feed river."
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: items matching the lens
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SearchResponse" }
        "404": { description: not found }
  /lenses/{id}/kindle:
    post:
      operationId: sendLensToKindle
      summary: Send this Lens's current matches to Kindle as a digest EPUB
      description: "Runs the Lens's saved rule, builds a multi-chapter EPUB digest (one chapter per matching item with a body, capped at 25), and e-mails it to the configured KINDLE_EMAIL address. Queued asynchronously; 409 when Send-to-Kindle is not configured, 422 when no matching items have a body to send."
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "202":
          description: queued
          content:
            application/json:
              schema:
                type: object
                required: [queued]
                properties:
                  queued: { type: boolean }
        "404": { description: not found }
        "409": { description: kindle is not configured }
        "422": { description: no matching items with a body to send }
  /feeds:
    get:
      operationId: listFeeds
      description: "List the caller's RSS/Atom feed subscriptions, newest first."
      responses:
        "200":
          description: feeds
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Feed" }
    post:
      operationId: createFeed
      description: "Subscribe to an RSS/Atom feed. Its current entries are backfilled as pending items immediately; a periodic poll saves new entries as they publish."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateFeedRequest" }
      responses:
        "201":
          description: created feed subscription
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Feed" }
        "400": { description: invalid url }
        "409": { description: already subscribed }
        "502": { description: feed could not be fetched or parsed }
  /feeds/{id}:
    delete:
      operationId: deleteFeed
      description: "Unsubscribe from a feed. Already-imported items are kept; polling stops."
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: deleted }
        "404": { description: not found }
  /desk:
    get:
      operationId: getDesk
      description: "The caller's Desk: pinned items ordered newest-pinned first."
      responses:
        "200":
          description: pinned items
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Item" }
  /feed:
    get:
      operationId: getFeedItems
      parameters:
        - { name: limit, in: query, schema: { type: integer } }
        - { name: feedId, in: query, schema: { type: string, format: uuid } }
        - { name: cursor, in: query, schema: { type: string }, description: "Opaque cursor from a previous page's nextCursor. Omit for the first page." }
      responses:
        "200":
          description: feed-originated items, newest first
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ItemPage" }
        "400": { description: invalid cursor }
  /drift:
    get:
      operationId: getDrift
      description: "Today's Drift batch: up to 5 resurfacing candidates (enriched, unpinned, not drifted in the last 30 days) ordered never-drifted-first then oldest-saved, plus the total candidate count."
      responses:
        "200":
          description: drift batch
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DriftResponse" }
  /drift/{id}:
    post:
      operationId: driftItem
      description: "Act on a drifted item: always marks it drifted now (won't resurface for 30 days); when keep is true, also pins it to the Desk."
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DriftActionRequest" }
      responses:
        "200":
          description: acted
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: { type: boolean }
        "404": { description: not found }
  /search:
    get:
      operationId: searchItems
      description: >
        Text search (q), colour-proximity (color), and/or structured filters
        (types, domains), optionally limited by scope. Set parse=true to
        interpret q as a natural-language query — the AI provider may extract
        text, colour, types, and domains, all fused into one search. Explicit
        params win over parsed values. At least one of q, color, types, or
        domains is required (scope alone is not enough). Results rank library
        items (direct saves and kept feed items) ahead of unkept feed-river
        matches when scope includes them; within each group ordering is by
        descending fused score.
      parameters:
        - { name: q, in: query, required: false, schema: { type: string } }
        - { name: color, in: query, required: false, schema: { type: string }, description: "Hex (#RRGGBB) or named colour (e.g. cobalt, terracotta); ranks items by nearest palette colour." }
        - name: types
          in: query
          required: false
          style: form
          explode: true
          description: "Card types to include (filter). Repeatable query param."
          schema:
            type: array
            items: { type: string, enum: [article, product, book, recipe, video, tweet, image, note, quote, repo] }
        - name: domains
          in: query
          required: false
          style: form
          explode: true
          description: "URL hosts to include (filter). Normalised lowercase; www stripped. Subdomains match."
          schema:
            type: array
            items: { type: string, minLength: 1 }
        - name: scope
          in: query
          required: false
          description: "library = saved/kept only; all = include unkept feed items. Defaults to all when omitted on /search."
          schema: { type: string, enum: [library, all], default: all }
        - { name: parse, in: query, required: false, schema: { type: boolean }, description: "Interpret q as a natural-language query, splitting it into text + colour + card-type + domain filters via the AI provider. Falls back to a plain text search when no AI provider is configured." }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SearchResponse" }
  /api-keys:
    get:
      operationId: listApiKeys
      description: "List the caller's API keys, newest first. Full key values are never returned after creation."
      responses:
        "200":
          description: api keys
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ApiKey" }
    post:
      operationId: createApiKey
      description: "Create a new API key. The full key is returned exactly once — store it now."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateApiKeyRequest" }
      responses:
        "201":
          description: created api key
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiKeyCreated" }
        "400": { description: bad request }
  /api-keys/{id}:
    delete:
      operationId: revokeApiKey
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: revoked }
        "404": { description: not found }
  /device-links:
    post:
      operationId: createDeviceLink
      description: "Mint a short-lived device-link code (10 minute TTL) that a second device can redeem via POST /device-links/claim to obtain its own API key."
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateDeviceLinkRequest" }
      responses:
        "201":
          description: device link code
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeviceLinkCreated" }
  /account:
    get:
      operationId: getAccount
      description: "Read-only facts about the calling account: who it is, and how much it holds. Separate from /settings, which is mutable preferences."
      responses:
        "200":
          description: account
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Account" }
  /settings:
    get:
      operationId: getSettings
      description: "The caller's account-level settings (e.g. the Kindle e-mail used for Send-to-Kindle)."
      responses:
        "200":
          description: settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Settings" }
    patch:
      operationId: patchSettings
      description: "Update account-level settings. Only provided fields are changed."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PatchSettingsRequest" }
      responses:
        "200":
          description: updated settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Settings" }
        "400": { description: invalid e-mail }
  /push-devices:
    post:
      operationId: registerPushDevice
      description: "Register (or refresh) an Expo push token for the calling device. Idempotent on the token; re-registering clears any prior delivery failure. The row is tied to the calling API key, so signing out removes it."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterPushDeviceRequest" }
      responses:
        "204": { description: registered }
        "400": { description: invalid token or platform }
        "409": { description: token is already registered to a different account }
  /push-devices/unregister:
    post:
      operationId: unregisterPushDevice
      description: "Stop delivering push notifications to a token. Deliberately a POST rather than DELETE /push-devices/{token}: an Expo token contains square brackets, which are an encoding hazard in a path segment across the generated clients."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UnregisterPushDeviceRequest" }
      responses:
        "204": { description: unregistered }
        "400": { description: missing token }
  /device-links/claim:
    post:
      operationId: claimDeviceLink
      security: []
      description: "Redeem a device-link code for a fresh API key. The code itself is the credential — this endpoint bypasses bearer auth but is rate-limited per IP. Unknown, expired, or already-claimed codes return an identical 404 to avoid leaking which case applied."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ClaimDeviceLinkRequest" }
      responses:
        "201":
          description: minted api key
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeviceLinkClaimed" }
        "404": { description: unknown, expired, or already-claimed code }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer }
  schemas:
    CreateItemRequest:
      type: object
      description: "Exactly one of url or note must be provided."
      properties:
        url: { type: string, format: uri }
        note: { type: string, minLength: 1, maxLength: 10000 }
    Item:
      type: object
      required: [id, url, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        url: { type: string }
        title: { type: string }
        summary: { type: string }
        leadImageUrl: { type: string }
        tags: { type: array, items: { type: string } }
        userTags: { type: array, items: { type: string } }
        palette: { type: array, items: { type: string } }
        cardType: { type: string, enum: [article, product, book, recipe, video, tweet, image, note, quote, repo] }
        status: { type: string, enum: [pending, enriched, failed] }
        createdAt: { type: string, format: date-time }
        pinnedAt: { type: string, format: date-time, nullable: true, description: "When the item was pinned to the Desk; null if not pinned." }
        pageCount: { type: integer, nullable: true, description: "Page count when the item's original is a stored PDF; null otherwise." }
        feedId: { type: string, format: uuid, nullable: true, description: "The feed this item originated from; null if not feed-sourced." }
        keptAt: { type: string, format: date-time, nullable: true, description: "When the item was kept in the library from its feed; null if not kept." }
    ItemPage:
      type: object
      description: >
        One page of items, newest first. nextCursor is opaque — pass it back as
        ?cursor= to fetch the following page. It is absent when there are no
        more items, so its presence is the only "has more" signal a client needs.
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Item" }
        nextCursor: { type: string }
    ItemDetail:
      allOf:
        - $ref: "#/components/schemas/Item"
        - type: object
          required: [body]
          properties:
            body: { type: string }
    RelatedItem:
      type: object
      required: [item, distance]
      properties:
        item: { $ref: "#/components/schemas/Item" }
        distance: { type: number, format: double }
    Place:
      type: object
      required: [id, name, hint, address, source]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        hint: { type: string, description: "disambiguating locality from the source text, e.g. a city" }
        address: { type: string, description: "geocoder display address; empty when not geocoded" }
        lat: { type: number, format: double }
        lng: { type: number, format: double }
        source: { type: string, description: "which signal produced this place (caption or vision)" }
    PlaceWithItem:
      allOf:
        - $ref: "#/components/schemas/Place"
        - type: object
          required: [itemId, itemTitle, itemCardType]
          properties:
            itemId: { type: string, format: uuid }
            itemTitle: { type: string }
            itemCardType: { type: string }
    Highlight:
      type: object
      required: [id, sourceItemId, quoteItemId, exact, prefix, suffix, offsetHint, createdAt]
      properties:
        id: { type: string, format: uuid }
        sourceItemId: { type: string, format: uuid }
        quoteItemId: { type: string, format: uuid }
        exact: { type: string }
        prefix: { type: string }
        suffix: { type: string }
        offsetHint: { type: integer }
        createdAt: { type: string, format: date-time }
    CreateHighlightRequest:
      type: object
      required: [exact]
      properties:
        exact: { type: string }
        prefix: { type: string }
        suffix: { type: string }
        offsetHint: { type: integer }
    CreateHighlightResponse:
      type: object
      required: [highlight, quoteItem]
      properties:
        highlight: { $ref: "#/components/schemas/Highlight" }
        quoteItem: { $ref: "#/components/schemas/Item" }
    UpdateItemRequest:
      type: object
      description: "Fields to update on an item. Both userTags and pinned are optional; omit both for a no-op edit that is rejected as a bad request."
      properties:
        userTags: { type: array, items: { type: string }, description: "Full replacement user-tags list. An empty array clears all user tags." }
        pinned: { type: boolean, description: "Pin (true) or unpin (false) the item on the Desk. Pinning sets pinnedAt to now; unpinning clears it." }
        kept: { type: boolean, description: "Keep (true) the item in the library independent of its feed. Sets keptAt to now." }
    DriftResponse:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Item" }
        total: { type: integer, description: "Total current drift candidates (for the 'n of total' line)." }
    DriftActionRequest:
      type: object
      required: [keep]
      properties:
        keep: { type: boolean, description: "Keep the item (pins it to the Desk); false lets it go." }
    SearchResult:
      type: object
      required: [item, score]
      properties:
        item: { $ref: "#/components/schemas/Item" }
        score: { type: number }
    SearchResponse:
      type: object
      required: [results]
      properties:
        results:
          type: array
          items: { $ref: "#/components/schemas/SearchResult" }
        understood:
          $ref: "#/components/schemas/UnderstoodQuery"
    UnderstoodQuery:
      type: object
      description: "How a natural-language query was interpreted (present only when parse=true). Reflects the values actually searched."
      properties:
        text: { type: string, description: "The free-text portion searched." }
        color: { type: string, description: "The colour searched, if any." }
        types:
          type: array
          description: "Card-type filters applied, if any."
          items: { type: string, enum: [article, product, book, recipe, video, tweet, image, note, quote, repo] }
        domains:
          type: array
          description: "URL host filters applied, if any."
          items: { type: string }
    LensRule:
      type: object
      description: >
        A saved search Query. At least one of q, color, types, or domains must be set.
        Rank signals: q (FTS+vector), color (palette proximity). Hard filters: types,
        domains (URL host / subdomain), scope (library = Mind only; all = include feed river).
        Omitted scope defaults to library when the rule is run as a Lens.
      properties:
        q: { type: string, description: "Free-text query (rank)." }
        color: { type: string, description: "Hex (#RRGGBB) or named colour (e.g. cobalt)." }
        types:
          type: array
          description: "Card types to include (filter)."
          items: { type: string, enum: [article, product, book, recipe, video, tweet, image, note, quote, repo] }
        domains:
          type: array
          description: "URL hosts to include (filter). Normalised lowercase; www stripped. Subdomains match (x.com matches mobile.x.com)."
          items: { type: string, minLength: 1 }
        scope:
          type: string
          description: "library = saved/kept only; all = include unkept feed items. Lens runs default to library when omitted."
          enum: [library, all]
    Lens:
      type: object
      required: [id, name, rule, createdAt, digestSchedule]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        rule: { $ref: "#/components/schemas/LensRule" }
        createdAt: { type: string, format: date-time }
        digestSchedule: { type: string, description: "Cron-like digest schedule string; empty means digests are disabled for this Lens." }
        lastDigestAt: { type: string, format: date-time, nullable: true, description: "When this Lens last sent a digest; null if it never has." }
    CreateLensRequest:
      type: object
      required: [name, rule]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        rule: { $ref: "#/components/schemas/LensRule" }
        digestSchedule: { type: string, description: "Optional cron-like digest schedule; omit or empty to leave digests disabled." }
    Feed:
      type: object
      required: [id, url, title, siteUrl, lastStatus, createdAt]
      properties:
        id: { type: string, format: uuid }
        url: { type: string }
        title: { type: string }
        siteUrl: { type: string }
        lastPolledAt: { type: string, format: date-time, description: "Absent until the feed has been polled at least once." }
        lastStatus: { type: string, description: "'ok' or 'error: …' from the most recent poll; empty before the first poll." }
        createdAt: { type: string, format: date-time }
    CreateFeedRequest:
      type: object
      required: [url]
      properties:
        url: { type: string, format: uri }
    ApiKey:
      type: object
      required: [id, name, prefix, createdAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        prefix: { type: string, description: "Non-secret display prefix (e.g. omk_AbCd1234)." }
        createdAt: { type: string, format: date-time }
        lastUsedAt: { type: string, format: date-time, description: "Absent until the key has authenticated a request." }
        revokedAt: { type: string, format: date-time, description: "Absent unless the key has been revoked." }
    ApiKeyCreated:
      type: object
      required: [key, id, name, prefix, createdAt]
      properties:
        key: { type: string, description: "The full API key — shown exactly once." }
        id: { type: string, format: uuid }
        name: { type: string }
        prefix: { type: string }
        createdAt: { type: string, format: date-time }
    CreateApiKeyRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
    CreateDeviceLinkRequest:
      type: object
      properties:
        deviceHint: { type: string, maxLength: 80 }
    DeviceLinkCreated:
      type: object
      required: [code, expiresAt]
      properties:
        code: { type: string, description: "8-character code formatted as ABCD-EFGH." }
        expiresAt: { type: string, format: date-time }
    ClaimDeviceLinkRequest:
      type: object
      required: [code, deviceName]
      properties:
        code: { type: string }
        deviceName: { type: string, minLength: 1, maxLength: 80 }
    DeviceLinkClaimed:
      type: object
      required: [key, name]
      properties:
        key: { type: string, description: "The full API key — shown exactly once." }
        name: { type: string }
    Account:
      type: object
      required: [itemCount, assetBytes]
      properties:
        email: { type: string, description: "The account's e-mail. Empty in single-user token mode, which has no identity provider — callers must render a neutral label rather than inventing one." }
        itemCount: { type: integer, format: int64, description: "Items the caller owns." }
        assetBytes: { type: integer, format: int64, description: "Total bytes of uploaded assets. There is no quota — self-hosting is unbounded — so this is usage, not a fraction of a limit." }
    Settings:
      type: object
      properties:
        kindleEmail: { type: string, format: email, description: "Destination e-mail for Send-to-Kindle digests; absent if not configured." }
        notifyDigest: { type: string, enum: [off, push, email, both], description: "Channels for Lens digest notifications. Default push." }
        notifyFeedRiver: { type: string, enum: [off, push, email, both], description: "Channels for coalesced feed-river activity. Default off." }
        notifyLifecycle: { type: string, enum: [off, push, email, both], description: "Channels for save-failure notifications. Default push. Exempt from the daily cap." }
        notifyQuietHours: { type: string, description: "Wall-clock range in the user's timezone, e.g. 22:00-07:00. Empty means none." }
        notifyTimezone: { type: string, description: "IANA timezone used for quiet hours and the daily-cap reset, e.g. Europe/London." }
        notifyDailyCap: { type: integer, description: "Maximum successful deliveries per day before non-lifecycle notifications defer. Default 10." }
    PatchSettingsRequest:
      type: object
      properties:
        kindleEmail: { type: string, format: email }
        notifyDigest: { type: string, enum: [off, push, email, both] }
        notifyFeedRiver: { type: string, enum: [off, push, email, both] }
        notifyLifecycle: { type: string, enum: [off, push, email, both] }
        notifyQuietHours: { type: string }
        notifyTimezone: { type: string }
        notifyDailyCap: { type: integer }
    RegisterPushDeviceRequest:
      type: object
      required: [token, platform]
      properties:
        token: { type: string, description: "Expo push token, e.g. ExponentPushToken[xxx]." }
        platform: { type: string, enum: [ios, android] }
    UnregisterPushDeviceRequest:
      type: object
      required: [token]
      properties:
        token: { type: string }
    ImportResult:
      type: object
      description: "Summary of a bulk import."
      required: [total, imported, skipped, failed]
      properties:
        total: { type: integer, description: "Links found in the file." }
        imported: { type: integer, description: "New items created (and queued for enrichment)." }
        skipped: { type: integer, description: "Links skipped as already saved or duplicated within the file." }
        failed: { type: integer, description: "Links rejected (not a valid http(s) URL) or that failed to save." }
