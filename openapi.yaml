openapi: 3.0.3
info: { title: Openmind API, version: 0.0.1 }
security:
  - bearerAuth: []
paths:
  /healthz:
    get:
      operationId: getHealthz
      security: []
      responses:
        "200":
          description: liveness
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string }
  /items:
    post:
      operationId: createItem
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateItemRequest" }
      responses:
        "201":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Item" }
    get:
      operationId: listItems
      parameters:
        - { name: limit, in: query, schema: { type: integer, default: 50 } }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Item" }
  /items/{id}:
    get:
      operationId: getItem
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: item detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ItemDetail" }
        "404":
          description: not found
    delete:
      operationId: deleteItem
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: deleted }
        "404": { description: not found }
  /assets:
    post:
      operationId: createAsset
      description: "Upload a local image as a first-class image card (multipart field 'file')."
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        "201":
          description: created image item
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Item" }
        "400": { description: bad request }
        "413": { description: payload too large }
        "415": { description: unsupported media type }
  /assets/{id}:
    get:
      operationId: getAsset
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: image bytes
          content:
            image/png: { schema: { type: string, format: binary } }
            image/jpeg: { schema: { type: string, format: binary } }
            image/gif: { schema: { type: string, format: binary } }
            image/webp: { schema: { type: string, format: binary } }
            image/avif: { schema: { type: string, format: binary } }
        "404": { description: not found }
  /export:
    get:
      operationId: exportItems
      responses:
        "200":
          description: full library export
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ItemDetail" }
  /search:
    get:
      operationId: searchItems
      parameters:
        - { name: q, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SearchResult" }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer }
  schemas:
    CreateItemRequest:
      type: object
      description: "Exactly one of url or note must be provided."
      properties:
        url: { type: string, format: uri }
        note: { type: string, minLength: 1, maxLength: 10000 }
    Item:
      type: object
      required: [id, url, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        url: { type: string }
        title: { type: string }
        summary: { type: string }
        leadImageUrl: { type: string }
        tags: { type: array, items: { type: string } }
        palette: { type: array, items: { type: string } }
        cardType: { type: string, enum: [article, product, book, recipe, video, tweet, image, note, quote] }
        status: { type: string, enum: [pending, enriched, failed] }
        createdAt: { type: string, format: date-time }
    ItemDetail:
      allOf:
        - $ref: "#/components/schemas/Item"
        - type: object
          required: [body]
          properties:
            body: { type: string }
    SearchResult:
      type: object
      required: [item, score]
      properties:
        item: { $ref: "#/components/schemas/Item" }
        score: { type: number }
