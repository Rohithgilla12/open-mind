openapi: 3.0.3
info: { title: Openmind API, version: 0.0.1 }
security:
  - bearerAuth: []
paths:
  /healthz:
    get:
      operationId: getHealthz
      security: []
      responses:
        "200":
          description: liveness
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string }
  /items:
    post:
      operationId: createItem
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateItemRequest" }
      responses:
        "201":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Item" }
    get:
      operationId: listItems
      parameters:
        - { name: limit, in: query, schema: { type: integer, default: 50 } }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Item" }
  /items/{id}:
    get:
      operationId: getItem
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: item detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ItemDetail" }
        "404":
          description: not found
    delete:
      operationId: deleteItem
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: deleted }
        "404": { description: not found }
  /assets:
    post:
      operationId: createAsset
      description: "Upload a local image as a first-class image card (multipart field 'file')."
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        "201":
          description: created image item
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Item" }
        "400": { description: bad request }
        "413": { description: payload too large }
        "415": { description: unsupported media type }
  /assets/{id}:
    get:
      operationId: getAsset
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: image bytes
          content:
            image/png: { schema: { type: string, format: binary } }
            image/jpeg: { schema: { type: string, format: binary } }
            image/gif: { schema: { type: string, format: binary } }
            image/webp: { schema: { type: string, format: binary } }
            image/avif: { schema: { type: string, format: binary } }
        "404": { description: not found }
  /export:
    get:
      operationId: exportItems
      responses:
        "200":
          description: full library export
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ItemDetail" }
  /import:
    post:
      operationId: importItems
      description: "Bulk-import saved items from an export file (multipart field 'file'). Recognises Netscape bookmark HTML (browsers, Pocket, Raindrop, Pinboard, Instapaper), CSV exports with a URL column (Pocket, Raindrop), and a plain newline-delimited URL list. Each new URL becomes a pending item and is enriched asynchronously; URLs already saved are skipped, so re-importing is safe."
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        "200":
          description: import summary
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportResult" }
        "400": { description: bad request / unparseable file }
        "413": { description: payload too large }
  /lenses:
    get:
      operationId: listLenses
      description: "List the caller's saved Lenses (saved query/rule collections), newest first."
      responses:
        "200":
          description: lenses
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Lens" }
    post:
      operationId: createLens
      description: "Create a Lens: a named, saved search rule. New saves matching the rule appear through it automatically."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateLensRequest" }
      responses:
        "201":
          description: created lens
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Lens" }
        "400": { description: bad request }
  /lenses/{id}:
    get:
      operationId: getLens
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: lens
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Lens" }
        "404": { description: not found }
    patch:
      operationId: updateLens
      description: "Rename a Lens and/or replace its rule."
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateLensRequest" }
      responses:
        "200":
          description: updated lens
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Lens" }
        "400": { description: bad request }
        "404": { description: not found }
    delete:
      operationId: deleteLens
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: deleted }
        "404": { description: not found }
  /lenses/{id}/items:
    get:
      operationId: getLensItems
      description: "Run the Lens's saved rule and return the ranked items it currently matches — a live view, so new saves appear here without manual filing."
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: items matching the lens
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SearchResponse" }
        "404": { description: not found }
  /feeds:
    get:
      operationId: listFeeds
      description: "List the caller's RSS/Atom feed subscriptions, newest first."
      responses:
        "200":
          description: feeds
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Feed" }
    post:
      operationId: createFeed
      description: "Subscribe to an RSS/Atom feed. Its current entries are backfilled as pending items immediately; a periodic poll saves new entries as they publish."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateFeedRequest" }
      responses:
        "201":
          description: created feed subscription
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Feed" }
        "400": { description: invalid url }
        "409": { description: already subscribed }
        "502": { description: feed could not be fetched or parsed }
  /feeds/{id}:
    delete:
      operationId: deleteFeed
      description: "Unsubscribe from a feed. Already-imported items are kept; polling stops."
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: deleted }
        "404": { description: not found }
  /search:
    get:
      operationId: searchItems
      description: "Text search (q), colour-proximity search (color), or both fused. Set parse=true to interpret q as a natural-language query — the AI provider splits it into a text portion, a colour, and card-type filters, all fused into one search. At least one of q or color is required."
      parameters:
        - { name: q, in: query, required: false, schema: { type: string } }
        - { name: color, in: query, required: false, schema: { type: string }, description: "Hex (#RRGGBB) or named colour (e.g. cobalt, terracotta); ranks items by nearest palette colour." }
        - { name: parse, in: query, required: false, schema: { type: boolean }, description: "Interpret q as a natural-language query, splitting it into text + colour + card-type filters via the AI provider. Falls back to a plain text search when no AI provider is configured." }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SearchResponse" }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer }
  schemas:
    CreateItemRequest:
      type: object
      description: "Exactly one of url or note must be provided."
      properties:
        url: { type: string, format: uri }
        note: { type: string, minLength: 1, maxLength: 10000 }
    Item:
      type: object
      required: [id, url, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        url: { type: string }
        title: { type: string }
        summary: { type: string }
        leadImageUrl: { type: string }
        tags: { type: array, items: { type: string } }
        palette: { type: array, items: { type: string } }
        cardType: { type: string, enum: [article, product, book, recipe, video, tweet, image, note, quote] }
        status: { type: string, enum: [pending, enriched, failed] }
        createdAt: { type: string, format: date-time }
    ItemDetail:
      allOf:
        - $ref: "#/components/schemas/Item"
        - type: object
          required: [body]
          properties:
            body: { type: string }
    SearchResult:
      type: object
      required: [item, score]
      properties:
        item: { $ref: "#/components/schemas/Item" }
        score: { type: number }
    SearchResponse:
      type: object
      required: [results]
      properties:
        results:
          type: array
          items: { $ref: "#/components/schemas/SearchResult" }
        understood:
          $ref: "#/components/schemas/UnderstoodQuery"
    UnderstoodQuery:
      type: object
      description: "How a natural-language query was interpreted (present only when parse=true). Reflects the values actually searched."
      properties:
        text: { type: string, description: "The free-text portion searched." }
        color: { type: string, description: "The colour searched, if any." }
        types:
          type: array
          description: "Card-type filters applied, if any."
          items: { type: string, enum: [article, product, book, recipe, video, tweet, image, note, quote] }
    LensRule:
      type: object
      description: "A saved search rule. At least one of q, color, or types must be set. Applied like /search: q is text (FTS + vector), color ranks by palette proximity, types narrows by card type."
      properties:
        q: { type: string, description: "Free-text query." }
        color: { type: string, description: "Hex (#RRGGBB) or named colour (e.g. cobalt)." }
        types:
          type: array
          description: "Card types to include."
          items: { type: string, enum: [article, product, book, recipe, video, tweet, image, note, quote] }
    Lens:
      type: object
      required: [id, name, rule, createdAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        rule: { $ref: "#/components/schemas/LensRule" }
        createdAt: { type: string, format: date-time }
    CreateLensRequest:
      type: object
      required: [name, rule]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        rule: { $ref: "#/components/schemas/LensRule" }
    Feed:
      type: object
      required: [id, url, title, siteUrl, lastStatus, createdAt]
      properties:
        id: { type: string, format: uuid }
        url: { type: string }
        title: { type: string }
        siteUrl: { type: string }
        lastPolledAt: { type: string, format: date-time, description: "Absent until the feed has been polled at least once." }
        lastStatus: { type: string, description: "'ok' or 'error: …' from the most recent poll; empty before the first poll." }
        createdAt: { type: string, format: date-time }
    CreateFeedRequest:
      type: object
      required: [url]
      properties:
        url: { type: string, format: uri }
    ImportResult:
      type: object
      description: "Summary of a bulk import."
      required: [total, imported, skipped, failed]
      properties:
        total: { type: integer, description: "Links found in the file." }
        imported: { type: integer, description: "New items created (and queued for enrichment)." }
        skipped: { type: integer, description: "Links skipped as already saved or duplicated within the file." }
        failed: { type: integer, description: "Links rejected (not a valid http(s) URL) or that failed to save." }
