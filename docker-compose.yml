services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: openmind
      POSTGRES_PASSWORD: openmind
      POSTGRES_DB: openmind
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/initdb:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openmind"]
      interval: 2s
      timeout: 2s
      retries: 15

  api:
    build: apps/api
    command: ["all"]
    environment:
      DATABASE_URL: postgres://openmind:openmind@db:5432/openmind
      AI_PROVIDER: ${AI_PROVIDER:-noop}
      AI_PROVIDERS: ${AI_PROVIDERS:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      OPENAI_EMBED_MODEL: ${OPENAI_EMBED_MODEL:-}
      AI_RPM_GEMINI: ${AI_RPM_GEMINI:-}
      AI_RPM_OPENAI: ${AI_RPM_OPENAI:-}
      GEOCODER: ${GEOCODER:-}
      NOMINATIM_URL: ${NOMINATIM_URL:-}
      NOMINATIM_EMAIL: ${NOMINATIM_EMAIL:-}
      GOOGLE_PLACES_API_KEY: ${GOOGLE_PLACES_API_KEY:-}
      OPENMIND_TOKEN: ${OPENMIND_TOKEN:-}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      AUTH_MODE: ${AUTH_MODE:-}
      CLERK_ISSUER: ${CLERK_ISSUER:-}
      ASSETS_DIR: ${ASSETS_DIR:-/data/assets}
      ASSETS_MAX_BYTES: ${ASSETS_MAX_BYTES:-10485760}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      KINDLE_EMAIL: ${KINDLE_EMAIL:-}
    volumes:
      - assetsdata:/data/assets
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_AUTH_MODE: ${NEXT_PUBLIC_AUTH_MODE:-token}
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:-}
    environment:
      API_URL: http://api:8080
      NEXT_PUBLIC_AUTH_MODE: ${NEXT_PUBLIC_AUTH_MODE:-token}
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:-}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:-}
      CONTACT_EMAIL: ${CONTACT_EMAIL:-}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - api

volumes:
  pgdata:
  assetsdata:
